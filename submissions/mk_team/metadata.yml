approach:
The provided dataset contains several impurities. For instance, texts labeled as Amharic sometimes contain Arabic, English, French, or even Korean (e.g., indices 4195 and 2720). Similarly, many Yoruba texts are heavily polluted with English and French (e.g., indices 53588, 59177, and 37849).To clean the dataset, we apply specific filtering rules to remove texts that contain an excessive amount of foreign words. Following the data cleaning, we configure our BPE tokenizer with the following optimizations:
   -NFC Normalizer: Ensures a uniform Unicode encoding of the diacritics and accents heavily used in French and Yoruba
   -ByteLevel Pre-tokenizer with use_regex=False: Prevents the behavior of splitting words from punctuation. This is crucial for Amharic, which uses colon-like symbols (such as ፡) as word separators or attached punctuation.
   -Zero Unknown Tokens (100% Coverage): What makes this tokenizer particularly robust is its fallback mechanism. Before applying the BPE algorithm, all letters, symbols, and emojis are mapped into UTF-8 bytes. Since every character in the world can be broken down using this byte-based system, any unseen or rare symbol always has a guaranteed representation. This practically eliminates the issue of out-of-vocabulary words and ensures zero reconstruction errors during decoding.
