name: Validate submission

# Two entry points, because participants reach us two ways:
#   push to `submission`  - runs in their fork while they iterate
#   pull_request          - runs in THIS repo, so the PR carries a status check
# Without the second one a fork's pull request arrives with nothing verified
# on our side.
on:
  push:
    branches: [submission]
  pull_request:
    paths:
      - "submissions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the base to diff against
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Validate changed team directory
        run: >-
          uv run --frozen python scripts/validate_pr.py
          --base "${{ steps.base.outputs.ref }}"
          --head HEAD
      - name: Run evaluator contract tests
        run: uv run --frozen pytest
