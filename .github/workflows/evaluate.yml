name: Nightly leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

concurrency:
  group: nightly-leaderboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Obtain evaluation data
        id: data
        env:
          HIDDEN_DATASET_ID: ${{ secrets.HIDDEN_DATASET_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p artifacts
          if [ -n "$HIDDEN_DATASET_ID" ] && [ -n "$HF_TOKEN" ]; then
            uv run --frozen --group data python scripts/download_hidden_data.py \
              --repo-id "$HIDDEN_DATASET_ID" \
              --file public_test.csv \
              --output artifacts/public_test.csv
            echo "strict=--strict" >> "$GITHUB_OUTPUT"
          else
            echo "Prototype mode: using the bundled smoke fixture. It is too small for"
            echo "the guardrail to be meaningful, so failures are reported but do not"
            echo "fail the run. Configure HIDDEN_DATASET_ID and HF_TOKEN before launch."
            cp tests/fixtures/demo_public_test.csv artifacts/public_test.csv
            echo "strict=" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate accepted submissions
        run: >-
          uv run --frozen python scripts/update_leaderboard.py
          --data artifacts/public_test.csv
          --repeats 3
          ${{ steps.data.outputs.strict }}
      - name: Commit generated leaderboard
        run: |
          if git diff --quiet -- LEADERBOARD.md; then
            echo "Leaderboard is unchanged."
            exit 0
          fi
          git config user.name "amtc-leaderboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git commit -m "chore: update nightly leaderboard"
          git push
