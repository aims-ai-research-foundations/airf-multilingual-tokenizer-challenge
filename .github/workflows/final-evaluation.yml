name: Final private evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    environment: private-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Download private test split
        env:
          HIDDEN_DATASET_ID: ${{ secrets.HIDDEN_DATASET_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Same private dataset and credentials as the nightly leaderboard, so
          # there is only one secret to keep working. The final run reads
          # private_test.csv instead of public_test.csv.
          test -n "$HIDDEN_DATASET_ID"
          test -n "$HF_TOKEN"
          mkdir -p artifacts
          uv run --frozen --group data python scripts/download_hidden_data.py \
            --repo-id "$HIDDEN_DATASET_ID" \
            --file private_test.csv \
            --output artifacts/private_test.csv
      - name: Evaluate every submission on the private test split
        run: >-
          uv run --frozen python scripts/update_leaderboard.py
          --data artifacts/private_test.csv
          --csv artifacts/final_leaderboard.csv
          --markdown artifacts/FINAL_LEADERBOARD.md
          --json artifacts/final_leaderboard.json
          --failures artifacts/final_failures.json
          --repeats 3
          --strict
      - name: Remove hidden evaluation text
        if: always()
        run: rm -f artifacts/private_test.csv
      - uses: actions/upload-artifact@v4
        with:
          name: final-results
          path: |
            artifacts/final_leaderboard.csv
            artifacts/FINAL_LEADERBOARD.md
            artifacts/final_leaderboard.json
            artifacts/final_failures.json
          retention-days: 30
